name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      # QA L1: the lint debt that predates this check may only shrink. A file
      # may not gain problems, and a new file must have none
      # (scripts/lint-ratchet.mjs, lint-baseline.json).
      - name: Lint ratchet
        run: node scripts/lint-ratchet.mjs
