name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The checks compile the desktop app but never start Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build

  # packages/contracts is owned by ERP-Backend (ADR 0003); this copy must match its main branch.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: packages/contracts matches ERP-Backend main
        run: |
          git clone --depth 1 https://github.com/annsabbasi/ERP-Backend.git "$RUNNER_TEMP/backend"
          diff -r "$RUNNER_TEMP/backend/packages/contracts" packages/contracts

  # Every commit comes from the owner's account with no co-author lines (ADR 0004).
  commit-hygiene:
    runs-on: ubuntu-latest
    env:
      # Empty baseline: the whole history of this repository is clean, so every commit is checked.
      HYGIENE_BASELINE: ''
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: sh .github/scripts/commit-hygiene.sh "$HYGIENE_BASELINE" "$HEAD_SHA"
