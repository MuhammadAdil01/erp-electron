# Installers for testers come from the `installers` workflow (.github/workflows/installers.yml),
# which writes the API address into the packaged package.json (`erpApiUrl`, src/api-url.ts).
appId: com.erp.system
productName: ERP System
directories:
  output: release
files:
  - dist/**
  - package.json
# Packaged builds load the web app from these files (see src/main.ts).
extraResources:
  - from: ../web/dist
    to: web
# macOS: ad-hoc signature, so Apple Silicon Macs open the unsigned app (build/after-pack.cjs).
afterPack: build/after-pack.cjs
win:
  target: nsis
  artifactName: ERP-System-Setup-${version}.${ext}
mac:
  target: dmg
  artifactName: ERP-System-${version}-${arch}.${ext}
  # Not code-signed yet (decision D11): no Developer ID, no notarisation.
  identity: null
linux:
  target: AppImage
